name: Scrape Destockplus

on:
  # Lance le scraper toutes les 6 heures
  schedule:
    - cron: "0 */6 * * *"
  # Permet aussi de le lancer manuellement depuis l'onglet "Actions" sur GitHub
  workflow_dispatch:

# Nécessaire pour que le job puisse committer le fichier data/destockplus.json
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraper
        run: python destockplus.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/destockplus.json
          git diff --staged --quiet || git commit -m "Mise à jour automatique des données Destockplus"
          git push
