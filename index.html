<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERGIO DDR — Lots RAM</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #171b24;
    --border: #262c3a;
    --text: #e7e9ee;
    --muted: #8890a3;
    --accent: #5eead4;
    --ddr4: #7dd3fc;
    --ddr5: #c4b5fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 20px 60px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
  }
  #status {
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 14px;
  }
  thead th {
    text-align: left;
    padding: 12px 14px;
    color: var(--muted);
    font-weight: 550;
    font-size: 12.5px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .title-cell a {
    color: var(--text);
    text-decoration: none;
  }
  .title-cell a:hover { color: var(--accent); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ddr4 { background: rgba(125,211,252,0.12); color: var(--ddr4); }
  .badge.ddr5 { background: rgba(196,181,253,0.12); color: var(--ddr5); }
  .num { font-variant-numeric: tabular-nums; }
  .price-per-go {
    color: var(--accent);
    font-weight: 600;
  }
  .empty {
    color: var(--muted);
  }
  .source-badge {
    color: var(--muted);
    font-size: 12px;
  }
  .badge.new {
    background: rgba(94,234,212,0.15);
    color: var(--accent);
    margin-left: 6px;
  }
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .filters label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }  .refresh-btn {
    background: var(--accent);
    color: #0a0f14;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #refresh-status {
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>SERGIO DDR — Lots RAM</h1>
  <p class="subtitle">Données extraites de plusieurs sites de déstockage européens, mises à jour automatiquement</p>
  <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
    <button id="refresh-btn" class="refresh-btn">🔄 Lancer un nouveau scraping</button>
    <span id="refresh-status"></span>
  </div>
</header>

<main>
  <div id="status">Chargement des données…</div>
  <div class="filters" id="filters" style="display:none;">
    <select id="filter-source">
      <option value="">Toutes les sources</option>
    </select>
    <select id="filter-type">
      <option value="">DDR4 + DDR5</option>
      <option value="DDR4">DDR4 uniquement</option>
      <option value="DDR5">DDR5 uniquement</option>
    </select>
    <label>
      <input type="checkbox" id="filter-new" />
      Nouvelles annonces uniquement
    </label>
  </div>
  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>Annonce</th>
        <th>Source</th>
        <th>Type</th>
        <th>Quantité</th>
        <th>Capacité unité</th>
        <th>Prix total</th>
        <th>Prix / Go</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</main>

<script>
  const fmtEur = (n) => n == null ? "—" : n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  const fmtGo = (n) => n == null ? "—" : n + " Go";
  const fmtInt = (n) => n == null ? "—" : n.toLocaleString("fr-FR");

  let allLots = [];

  const refreshBtn = document.getElementById("refresh-btn");
  const refreshStatus = document.getElementById("refresh-status");

  refreshBtn.addEventListener("click", async () => {
    refreshBtn.disabled = true;
    refreshStatus.textContent = "Déclenchement du scraping…";
    try {
      const res = await fetch("/api/trigger-scrape", { method: "POST" });
      const data = await res.json();
      if (res.ok) {
        refreshStatus.textContent =
          "Scraping lancé sur GitHub, ça prend ~1 minute. Recharge cette page dans un instant pour voir les nouveautés.";
      } else {
        refreshStatus.textContent = "Erreur : " + (data.error || "impossible de lancer le scraping.");
      }
    } catch (err) {
      refreshStatus.textContent = "Erreur réseau : " + err.message;
    } finally {
      setTimeout(() => {
        refreshBtn.disabled = false;
      }, 15000);
    }
  });

  function renderLots() {
    const tbody = document.getElementById("tbody");
    const sourceFilter = document.getElementById("filter-source").value;
    const typeFilter = document.getElementById("filter-type").value;
    const newOnly = document.getElementById("filter-new").checked;

    tbody.innerHTML = "";

    const filtered = allLots.filter((lot) => {
      if (sourceFilter && lot.source !== sourceFilter) return false;
      if (typeFilter && lot.memory_type !== typeFilter) return false;
      if (newOnly && !lot.is_new) return false;
      return true;
    });

    filtered.forEach((lot) => {
      const tr = document.createElement("tr");
      const badgeClass = lot.memory_type === "DDR5" ? "ddr5" : "ddr4";
      const newBadge = lot.is_new ? '<span class="badge new">NOUVEAU</span>' : "";

      tr.innerHTML = `
        <td class="title-cell"><a href="${lot.url}" target="_blank" rel="noopener">${lot.title}</a>${newBadge}</td>
        <td class="source-badge">${lot.source}</td>
        <td><span class="badge ${badgeClass}">${lot.memory_type}</span></td>
        <td class="num">${fmtInt(lot.quantity)}</td>
        <td class="num">${fmtGo(lot.unit_capacity_go)}</td>
        <td class="num">${fmtEur(lot.price_total_eur)}${lot.price_is_per_unit ? " <span class=\"empty\">/u</span>" : ""}</td>
        <td class="num price-per-go">${lot.price_per_go_eur != null ? fmtEur(lot.price_per_go_eur) : "—"}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  fetch("data/lots.json")
    .then((res) => {
      if (!res.ok) throw new Error("Fichier JSON introuvable");
      return res.json();
    })
    .then((lots) => {
      const status = document.getElementById("status");
      const table = document.getElementById("table");
      const filters = document.getElementById("filters");

      if (!lots || lots.length === 0) {
        status.textContent = "Aucun lot trouvé pour le moment.";
        return;
      }

      allLots = lots;

      const sourceSelect = document.getElementById("filter-source");
      const sources = [...new Set(lots.map((l) => l.source))].sort();
      sources.forEach((src) => {
        const opt = document.createElement("option");
        opt.value = src;
        opt.textContent = src;
        sourceSelect.appendChild(opt);
      });

      document.getElementById("filter-source").addEventListener("change", renderLots);
      document.getElementById("filter-type").addEventListener("change", renderLots);
      document.getElementById("filter-new").addEventListener("change", renderLots);

      renderLots();

      status.style.display = "none";
      filters.style.display = "flex";
      table.style.display = "table";
    })
    .catch((err) => {
      document.getElementById("status").textContent =
        "Impossible de charger les données (" + err.message + "). Vérifie que data/lots.json existe.";
    });
</script>

</body>
</html>
